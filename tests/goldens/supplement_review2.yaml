# Supplement 2 (post-audit 2026-08-16): four rulings implemented in the
# engine that the reviewable set did not yet state explicitly.

- id: sup2-qalqalah-akbar
  surah: 111
  ayah: 1
  rule: R202_QALQALAH_AKBAR
  rule_ar: مراتب القلقلة ثلاث؛ صغرى للساكن الموصول، كبرى للموقوف عليه مخففًا،
    وأكبر للموقوف عليه مشددًا نحو وَتَبَّ (وأصل الباب الجزرية «وبيّن
    مقلقلًا إن سكنا»، وبعض أهل الأداء يقتصر على مرتبتين)
  cite: هداية القاري 1:84-85؛ بغية المستفيد 1:50-52؛ غاية المريد 1:146
  expert_reviewed: false
  expect_at_end:
    - {base: beh, geminated: true, qalqalah: akbar}
- id: sup2-maliyah-wasl
  surah: 69
  ayah: 28
  rule: R132_MALIYAH_SAKT
  rule_ar: وصل مَالِيَهْ (69:28) بـ هَلَكَ (69:29) فيه وجهان لحفص؛
    المقدَّم الإظهار مع سكتة لطيفة على هاء السكت من غير قطع نفس، والثاني
    إدغام الهاء في الهاء
  cite: النشر 2:21-22؛ هداية القاري 1:236-237؛ فتح الوصيد 1:434؛ غيث
    النفع 1:601
  expert_reviewed: false
  review_only: true
- id: sup2-ibtida-shadda
  surah: 2
  ayah: 177
  rule: R112_STRIP_INITIAL_SHADDA
  rule_ar: الشدة المرسومة على أول حرف من الآية (نحو لَّيْسَ) علامة إدغام
    آخر الآية السابقة فيه حال الوصل؛ فعند الابتداء بالآية يُقرأ الحرف
    مخففًا بلا تشديد (لَيْسَ)
  cite: (ضبط المصحف؛ علامة إدغام المتماثلين والمتقاربين بين الآيتين؛
    المحكم في نقط المصاحف للداني)
  expert_reviewed: false
  word: لَّي
  expect:
    - {base: lam, geminated: false}
    - {base: fatha}
  forbid:
    - {base: lam, geminated: true}
- id: sup2-istifham-tasheel
  surah: 10
  ayah: 51
  rule: R014B_ISTIFHAM_TASHEEL
  rule_ar: همزة الاستفهام الداخلة على همزة الوصل في المواضع الثلاثة
    (ءَآلْـَٰٔنَ، ءَآللَّهُ، ءَآلذَّكَرَيْنِ) فيها وجهان؛ إبدال همزة
    الوصل ألفًا مشبعة وهو المقدَّم، أو تسهيلها بين بين بلا مد
  cite: الشاطبية أبيات 192-194؛ النشر 1:377-378
  expert_reviewed: false
  review_only: true
- id: sup2-wasl-badal-hamza
  surah: 10
  ayah: 15
  rule: R110_BADAL_IBTIDA
  rule_ar: الابتداء بنحو ٱئْتِ؛ تُحرَّك همزة الوصل بالكسر وتُبدل الهمزة
    الساكنة بعدها حرف مد من جنس حركة الابتداء، فيُبتدأ إِيتِ بياء مدية
  cite: الجزرية؛ هداية القاري 2:482؛ النشر 1:390
  expert_reviewed: false
  word: ٱئْ
  expect:
    - {base: hamza}
    - {base: kasra}
    - {base: yeh_madd}
- id: sup2-tafkheem-maratib
  surah: 1
  ayah: 1
  rule: R210_MARATIB
  rule_ar: مراتب التفخيم خمس على المشهور؛ المفتوح وبعده ألف، فالمفتوح،
    فالمضموم، فالساكن (بحسب حركة ما قبله)، فالمكسور
  cite: التمهيد لابن الجزري (باب التفخيم)؛ جهد المقل للمرعشي؛ هداية
    القاري 1:116-118
  expert_reviewed: false
  review_only: true
- id: sup2-basmala-joins
  surah: 1
  ayah: 1
  rule: R136_BASMALA_JOINS
  rule_ar: البسملة بين السورتين لازمة لحفص من الشاطبية (وبسمل بين
    السورتين بسنة)، ولا بسملة في أول براءة؛ وفي وصل السورتين ثلاثة أوجه
    جائزة (قطع الجميع، وصل الجميع، قطع آخر السورة والابتداء بالبسملة
    موصولة بأول التالية)، والممنوع وصل آخر السورة بالبسملة والوقف عليها
    (ومهما تصلها مع أواخر سورة فلا تقفن الدهر فيها)؛ وبين الأنفال
    والتوبة ثلاثة أوجه بلا بسملة (الوقف والسكت والوصل)
  cite: الشاطبية أبيات 100-107؛ غيث النفع 1:270؛ البدور الزاهرة 1:133؛
    هداية القاري (الباب الثامن عشر)
  expert_reviewed: false
  review_only: true
- id: sup2-taa-maftuha-waqf
  surah: 43
  ayah: 32
  rule: R120_TAA_MAFTUHA
  rule_ar: ما رسم بالتاء المفتوحة من هاءات التأنيث نحو رَحْمَتَ
    (الزخرف 32) ونِعْمَتَ وامْرَأَتَ ويَٰٓأَبَتِ يوقف عليه بالتاء اتباعًا للرسم، لا
    بالهاء
  cite: الجزرية (باب التاءات) «ورحمتا الزخرف بالتا زبره»؛ هداية القاري
    (الباب الرابع عشر)
  expert_reviewed: false
  review_only: true
- id: sup2-idgham-taxonomy
  surah: 2
  ayah: 16
  rule: R160_TAXONOMY
  rule_ar: الإدغام صغير إن سكن أول الحرفين وكبير إن تحركا، وليس لحفص من
    الكبير شيء إلا ما جاء في تَأْمَنَّا على وجه الإدغام مع الإشمام؛
    والمتباعدان لا إدغام فيهما بحال
  cite: هداية القاري (الباب التاسع والعاشر)؛ النشر (باب الإدغام
    الصغير)؛ المقدمة الجزرية
  expert_reviewed: false
  review_only: true
- id: sup2-ittikhadh-izhar
  surah: 2
  ayah: 51
  rule: R160_ITTIKHADH_IZHAR
  rule_ar: باب الاتخاذ ولبثت؛ الذال الساكنة قبل التاء (اتَّخَذْتُمْ،
    أَخَذْتُمْ، عُذْتُ، نَبَذْتُهَا) والثاء الساكنة قبل التاء (لَبِثْتَ،
    لَبِثْتُمْ، أُورِثْتُمُوهَا) والدال الساكنة قبل الثاء (وَمَن يُرِدْ
    ثَوَابَ) كلها بالإظهار لحفص، والإدغام فيها
    لغيره من القراء؛ وضبط المصحف شاهد بالسكون عليهما
  cite: الشاطبية أبيات 279-284؛ إبراز المعاني (شرح البيتين)؛ هداية
    القاري (باب الاتخاذ عن المتولي)
  expert_reviewed: false
  expect:
    - {base: thal}
    - {base: teh}
- id: sup2-hadhf-ithbat
  surah: 18
  ayah: 64
  rule: R190_HADHF_ITHBAT
  rule_ar: حذف حروف المد وإثباتها تبعٌ للرسم العثماني؛ فما ثبت رسمًا
    وُقف عليه بالإثبات وما حُذف وُقف عليه بالحذف (نحو يَدْعُ، يَمْحُ،
    وَٱلَّيْلِ إِذَا يَسْرِ)، إلا ما استثنته الرواية نحو ءَاتَىٰنِ
    بالوجهين والألفات السبع
  cite: غاية المريد (باب الحذف والإثبات)؛ هداية القاري (الباب السادس
    عشر)؛ الوجيز (باب الإثبات والحذف)
  expert_reviewed: false
  review_only: true
- id: sup2-qalqalah-tabiyya
  surah: 2
  ayah: 3
  rule: R200_TABIYYA
  rule_ar: صوت القلقلة يتبع الحرف المقلقل تفخيمًا وترقيقًا؛ يفخَّم في
    القاف والطاء ويرقَّق في الباء والجيم والدال، ولا يمال إلى حركة
    بعينها
  cite: هداية القاري (كيفية أداء القلقلة)؛ غاية المريد (القلقلة)
  expert_reviewed: false
  review_only: true
- id: sup2-lamat-sawakin
  surah: 16
  ayah: 78
  rule: R133_LAMAT
  rule_ar: اللامات السواكن سوى لام التعريف (لام الاسم نحو أَلْسِنَتِكُمْ،
    ولام الفعل، ولام الحرف نحو هَلْ وبَلْ، ولام الأمر) حكمها الإظهار؛
    إلا لام الفعل والحرف عند اللام والراء فتدغم (قُل رَّبِّ، بَل
    رَّفَعَهُ) وما استثني بالسكت (بَلْ ۜ رَانَ)
  cite: هداية القاري (الباب الثامن في اللامات الساكنة)؛ المقدمة
    الجزرية (باب اللامات)
  expert_reviewed: false
  review_only: true
