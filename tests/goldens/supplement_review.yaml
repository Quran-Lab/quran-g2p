# Supplement: rulings implemented and tested in the engine's python suite
# that were missing from the reviewable golden set. Rows marked
# review_only are statement-rulings (taxonomies, wajh taqdims, junction
# behavior) not expressible as a single-ayah phone pattern; the harness
# skips them and the expert packet includes them.

- id: sup-2-72-seat-dagger
  surah: 2
  ayah: 72
  rule: R010_SEAT_DAGGER
  rule_ar: فَٱدَّٰرَٰءْتُمْ — الألف الثالثة صورة (سرج) للهمزة الساكنة لا
    تُنطق؛ فالراء بفتحة خالصة تليها الهمزة الساكنة مباشرة، والمد الوحيد في
    الكلمة ألف التفاعل بعد الدال بمقدار حركتين، ولا متصل فيها
  cite: دليل الحيران 1:415؛ ورد الطائف 1:230؛ لطائف الإشارات 2:216؛ هداية
    القاري 1:280
  expert_reviewed: false
  expect:
    - {base: reh}
    - {base: fatha, kind: vowel}
    - {base: hamza}
- id: sup-17-7-waw-restored
  surah: 17
  ayah: 7
  rule: R013_WAW_RESTORED
  rule_ar: لِيَسُوٓءُوا۟ — الرسم بواو واحدة والتلاوة بإثبات الواو الأولى
    (همزة بين واوين)، والمد عليها متصل لوقوع الهمز بعدها في كلمة
  cite: الحجة للقراء السبعة 5:85؛ المحكم في نقط المصاحف 1:168؛ دليل
    الحيران 1:405-406
  expert_reviewed: false
  expect:
    - {base: seen}
    - {base: damma}
    - {base: waw_madd, len_allowed: [4, 5]}
    - {base: hamza}
- id: sup-sakt-class
  surah: 75
  ayah: 27
  rule: R132_SAKT_CLASS
  rule_ar: سكتات حفص الأربع من طريق الشاطبية (عِوَجَا 18:1، مَرْقَدِنَا
    36:52، مَنْ رَاقٍ 75:27، بَلْ رَانَ 83:14) لازمة في الوصل، بلا تنفس،
    وتمنع جريان الإدغام والإخفاء عبر موضعها
  cite: الشاطبية بيتا 830-831؛ النشر 1:240-241؛ سراج القارئ 1:277
  expert_reviewed: false
  review_only: true
- id: sup-sakt-75-27
  surah: 75
  ayah: 27
  rule: R132_SAKT
  rule_ar: وَقِيلَ مَنْ ۜ رَاقٍ — الإظهار مع السكت على نون (مَنْ)، ولا
    إدغام بلا غنة رغم التقاء النون بالراء
  cite: الشاطبية بيت 831؛ النشر 1:240
  expert_reviewed: false
  expect:
    - {base: noon, sakt_after: true}
    - {base: reh}
- id: sup-taamanna-ishmam
  surah: 12
  ayah: 11
  rule: R220_ISHMAM
  rule_ar: لَا تَأْمَنَّا — تُقرأ بالإدغام مع الإشمام على المشهور المطبوع
    في المصاحف، والاختلاس (ويسميه كثيرون الروم) وجه ثانٍ صحيح مقروء به،
    وقدّمه بعض المحققين
  cite: الشاطبية؛ هداية القاري 1:259-261؛ النشر 2:126
  expert_reviewed: false
  review_only: true
- id: sup-naql-49-11
  surah: 49
  ayah: 11
  rule: R134_LISM
  rule_ar: بِئْسَ ٱلِٱسْمُ — وصلًا تسقط همزتا الوصل وتُقرأ اللام بكسرتها
    المرسومة (بِئْسَ لِسْمُ)
  cite: (الرسم والضبط؛ هداية القاري 2:488)
  expert_reviewed: false
  expect:
    - {base: seen}
    - {base: fatha}
    - {base: lam}
    - {base: kasra}
    - {base: seen}
- id: sup-misr-qitr-asr
  surah: 12
  ayah: 99
  rule: R211_WAQF_KHILAF
  rule_ar: الوقف على مِصْرَ بالتفخيم (اختيار النشر «وأختار في مصر
    التفخيم»)، وعلى ٱلْقِطْرِ 34:12 بالترقيق، وعلى أَسْرِ/فَأَسْرِ
    بالترقيق المقدَّم لكسرة البناء
  cite: النشر 2:105، 2:110؛ النويري 2:33؛ هداية القاري 1:130-133
  expert_reviewed: false
  review_only: true
- id: sup-aataani-wajh
  surah: 27
  ayah: 36
  rule: R190C_AATAANI
  rule_ar: الوقف على ءَاتَىٰنِۦَ وجهان لحفص — إثبات الياء ساكنة (وهو
    المقدَّم في الأداء) وحذفها والوقف على النون؛ وفي الوصل تثبت الياء
    مفتوحة
  cite: الشاطبية بيت 429؛ هداية القاري 2:544-545؛ إبراز المعاني 1:309
  expert_reviewed: false
  review_only: true
- id: sup-rawm-general
  surah: 2
  ayah: 255
  rule: R123_RAWM_TAXONOMY
  rule_ar: الروم يدخل المضموم والمكسور فقط، والإشمام المضموم فقط، ولا
    يدخلان المفتوح؛ والعارض مع الروم بالقصر فقط
  cite: الشاطبية أبيات 368-373؛ النشر 2:121؛ التيسير 58-59
  expert_reviewed: false
  review_only: true
- id: sup-rawm-exclusions
  surah: 101
  ayah: 1
  rule: R123_RAWM_EXCLUSIONS
  rule_ar: لا روم ولا إشمام في هاء التأنيث (الموقوف عليها هاءً) ولا في
    ميم الجمع ولا في عارض الحركة
  cite: النشر 2:122-124، 2:126
  expert_reviewed: false
  review_only: true
- id: sup-rawm-haa-damir
  surah: 24
  ayah: 52
  rule: R123_RAWM_HAA
  rule_ar: هاء الضمير على مذهب التفصيل (أعدل المذاهب عند ابن الجزري) —
    يُمنع الروم والإشمام فيها بعد الضم والواو الساكنة والكسر والياء
    الساكنة، ويجوزان بعد الفتح والألف والساكن الصحيح (نحو وَيَتَّقْهِ
    لحفص بالروم)
  cite: النشر 2:124-125؛ الإتحاف 1:135-136؛ هداية القاري 1:322، 1:327-328
  expert_reviewed: false
  review_only: true
- id: sup-alm-allah
  surah: 3
  ayah: 1
  rule: R135_MEEM_ALLAH
  rule_ar: وصل الٓمٓ بلفظ الجلالة (3:1-2) — تُفتح ميم (مِيمْ) لالتقاء
    الساكنين، وتُفخَّم لام الجلالة، ويبقى المد اللازم في الياء على
    الإشباع (والقصر وجه، ولا توسُّط)
  cite: السبعة 1:199؛ غيث النفع 1:129-130؛ النويري 2:231
  expert_reviewed: false
  review_only: true
- id: sup-haa-sakt-wasl
  surah: 2
  ayah: 259
  rule: R123_HAA_SAKT_WASL
  rule_ar: هاء السكت ثابتة ساكنة وصلًا ووقفًا لحفص في مواضعها (لَمْ
    يَتَسَنَّهْ، ٱقْتَدِهْ، وأخواتها)، ولا يدخلها روم ولا إشمام
  cite: الإقناع 1:244؛ النشر 2:142؛ لطائف الإشارات 9:75
  expert_reviewed: false
  expect:
    - {base: noon, geminated: true}
    - {base: fatha}
    - {base: heh}
    - {base: waw, kind: consonant}
- id: sup-ayyuha-waqf
  surah: 43
  ayah: 49
  rule: R124_AYYUHA
  rule_ar: الوقف على أَيُّهَ في مواضعها الثلاث (الزخرف 49، النور 31،
    الرحمن 31) بالهاء الساكنة دون ألف اتباعًا للرسم
  cite: الشاطبية بيت 382؛ النشر 2:141-142؛ غيث النفع 531، 568
  expert_reviewed: false
  review_only: true
- id: sup-sifat-sets
  surah: 1
  ayah: 1
  rule: R214_SIFAT_SETS
  rule_ar: مجموعات الصفات كما في الجزرية — الهمس (فحثه شخص سكت)، الشدة
    (أجد قط بكت)، التوسط (لن عمر)، الاستعلاء (خص ضغط قظ)، الإطباق (ص ض ط
    ظ)، القلقلة (قطب جد)، الصفير (ص ز س)، الانحراف (ل ر)، التكرير (ر)،
    التفشي (ش)، الاستطالة (ض)، الإذلاق (فر من لب)
  cite: المقدمة الجزرية أبيات 20-26؛ النويري 1:237-238
  expert_reviewed: false
  review_only: true
- id: sup-alif-tabiyya
  surah: 1
  ayah: 1
  rule: R213_ALIF
  rule_ar: الألف المدية لا توصف بتفخيم ولا ترقيق استقلالًا بل تتبع ما
    قبلها — تفخَّم بعد المفخم وترقَّق بعد المرقق
  cite: النشر 1:215-216؛ هداية القاري 1:118؛ غاية المريد 1:158-159
  expert_reviewed: false
  review_only: true
- id: sup-ghunna-tabiyya
  surah: 15
  ayah: 26
  rule: R214_GHUNNA_TAFKHEEM
  rule_ar: غنة النون المخفاة تتبع ما بعدها — تُفخَّم عند خمسة أحرف فقط هي
    ص ض ط ظ ق، وترقَّق فيما سواها
  cite: هداية القاري 1:181-182؛ لطائف الإشارات 1:366-367
  expert_reviewed: false
  review_only: true
- id: sup-madd-amounts
  surah: 1
  ayah: 1
  rule: R180_AMOUNTS
  rule_ar: مقادير المدود لحفص من الشاطبية — المتصل والمنفصل أربع أو خمس،
    والمتصل وقفًا تجوز فيه الست، واللازم ست، والعارض واللين ٢/٤/٦ على ألا
    يزيد اللين على العارض، والطبيعي والبدل والعوض والصلة الصغرى حركتان،
    والصلة الكبرى كالمنفصل
  cite: الشاطبية باب المد؛ النشر 1:315-346؛ هداية القاري
  expert_reviewed: false
  review_only: true
