<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700&family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; }
  .banner {
    width: 1600px; height: 400px; box-sizing: border-box;
    background: linear-gradient(135deg, #06281d 0%, #0b3d2e 55%, #14532d 100%);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 90px; position: relative; overflow: hidden;
  }
  .banner::after {
    content: ""; position: absolute; inset: 22px;
    border: 1.5px solid rgba(212, 180, 106, .55); border-radius: 6px;
    pointer-events: none;
  }
  .left { color: #fff; }
  .name { font-family: "Cairo", sans-serif; font-weight: 800;
          font-size: 84px; letter-spacing: 1px; line-height: 1;
          color: #f5f1e6; }
  .name span { color: #d4b46a; }
  .tag { font-family: "Cairo", sans-serif; font-weight: 400;
         font-size: 25px; color: #cfe3d6; margin-top: 18px; }
  .org { font-family: "Cairo", sans-serif; font-weight: 600;
         font-size: 19px; color: #d4b46a; margin-top: 26px;
         letter-spacing: 2px; text-transform: uppercase; }
  .right { text-align: center; direction: rtl; }
  .ar-main { font-family: "Amiri", serif; font-weight: 700;
             font-size: 54px; color: #f5f1e6; line-height: 1.7; }
  .ar-sub { font-family: "Amiri", serif; font-size: 30px;
            color: #d4b46a; margin-top: 6px; }
</style>
</head>
<body>
  <div class="banner">
    <div class="left">
      <div class="name">quran<span>-</span>g2p</div>
      <div class="tag">A specification-first tajweed phonemizer for Quranic speech AI</div>
      <div class="org">Quran Lab &nbsp;·&nbsp; وقف</div>
    </div>
    <div class="right">
      <div class="ar-main">التحويل الصوتي القرآني<br>بأحكام التجويد</div>
      <div class="ar-sub">برواية حفص عن عاصم من طريق الشاطبية</div>
    </div>
  </div>
</body>
</html>
